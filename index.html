<style>
/* ============ DESIGN TOKENS ============ */
:root{
  /* surfaces */
  --app-bg:#f2f4f8;
  --surface:#ffffff;
  --surface-2:#f6f8fb;
  --surface-3:#eceff5;
  --surface-inset:#f1f4f9;

  /* navy / ink */
  --navy-900:#192c6d;
  --navy-800:#142357;
  --navy-700:#0f1a41;
  --navy-600:#0a112b;
  --ink:#000000;
  --ink-2:#37445f;
  --muted:#5a6b85;
  --muted-2:#8593a9;

  /* borders */
  --border:#dde3ec;
  --border-2:#cad3e0;
  --border-strong:#b6c1d3;

  /* interactive blue */
  --blue:#2e5cf6;
  --blue-600:#205bbf;
  --blue-700:#1a4a9e;
  --blue-50:#eaf1fc;
  --blue-100:#d6e3f9;
  --blue-tint:#eef4fd;

  /* national accents (muted) */
  --saffron:#c98a2b;
  --saffron-50:#faf2e3;
  --saffron-tint:#f6ead2;
  --green:#1b8a6b;
  --green-50:#e6f4ef;
  --green-tint:#d8efe6;
  --red:#c0392b;
  --red-50:#fbeae8;
  --amber:#d99514;
  --amber-50:#fbf2dd;

  /* radius / shadow */
  --r-sm:4px;
  --r:6px;
  --r-lg:10px;
  --r-xl:14px;
  --sh-1:0 1px 2px rgba(16,35,61,.06), 0 1px 1px rgba(16,35,61,.04);
  --sh-2:0 2px 6px rgba(16,35,61,.08), 0 1px 2px rgba(16,35,61,.05);
  --sh-3:0 8px 24px rgba(16,35,61,.12), 0 2px 6px rgba(16,35,61,.06);
  --sh-pop:0 16px 48px rgba(7,24,47,.20), 0 4px 12px rgba(7,24,47,.10);

  /* typography */
  --font:"Open Sans","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  /* layout */
  --rail:60px;
  --side:248px;
  --head:58px;

  --fs:15px;
}
:root[data-fs="lg"]{ --fs:16.5px; }
:root[data-fs="xl"]{ --fs:18px; }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:var(--font);
  font-size:var(--fs);
  color:var(--ink);
  background:var(--app-bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.45;
}
#root{ height:100vh; overflow:hidden; }

/* scrollbars */
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-thumb{ background:#c4cddc; border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-thumb:hover{ background:#aab6c9; background-clip:padding-box; }
*::-webkit-scrollbar-track{ background:transparent; }

/* shared helpers */
.mono{ font-family:var(--mono); font-feature-settings:"tnum"; }
.tnum{ font-feature-settings:"tnum"; }
button{ font-family:inherit; cursor:pointer; }
.hi-only{ display:none; }
:root[lang="hi"] .en-only{ display:none; }
:root[lang="hi"] .hi-only{ display:inline; }

::selection{ background:#cfe0fb; }

/* generic transitions */
.fade-in{ animation:fadeIn .35s ease both; }
@keyframes fadeIn{ from{transform:translateY(5px);} to{transform:none;} }
.rise{ animation:rise .4s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise{ from{transform:translateY(8px);} to{transform:none;} }
@keyframes pulseDot{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes blink{ 50%{ opacity:0; } }
@keyframes growBar{ from{ transform:translateY(14px); } to{ transform:translateY(0); } }
@keyframes drawLine{ to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
